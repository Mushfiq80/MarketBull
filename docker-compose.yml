services:
  postgres:
    # pgvector image so the `vector` extension is available for document retrieval
    image: pgvector/pgvector:pg16
    container_name: babull-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-babull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babull_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-babull}
      # Bangladesh Standard Time; internal timestamps remain UTC
      TZ: Asia/Dhaka
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - babull_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babull} -d ${POSTGRES_DB:-babull}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional lightweight DB browser. `docker compose up -d adminer` when wanted.
  adminer:
    image: adminer:latest
    container_name: babull-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  babull_pgdata:
    name: babull_pgdata
